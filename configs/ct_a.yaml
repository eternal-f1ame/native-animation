       "/home/aeternum/Research/Comic/Cartoon/models/Wan-AI/Wan2.2-TI2V-5B/diffusion_pytorch_model-00002-of-00003.safetensors",
       "/home/aeternum/Research/Comic/Cartoon/models/Wan-AI/Wan2.2-TI2V-5B/diffusion_pytorch_model-00003-of-00003.safetensors"]
